<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Fullstack Task App</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 50px; text-align: center; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input { padding: 10px; width: 65%; border: 1px solid #ccc; border-radius: 5px; }
        .add-btn { padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .add-btn:hover { background: #218838; }
        ul { list-style-type: none; padding: 0; margin-top: 20px; }
        li { background: #eee; margin: 5px 0; padding: 10px; border-radius: 5px; text-align: left; display: flex; justify-content: space-between; align-items: center;}
        .delete-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-weight: bold;}
        .delete-btn:hover { background: #c82333; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚀 My Cloud Task List</h2>
        
        <input type="text" id="taskInput" placeholder="Type a new task here...">
        <button class="add-btn" onclick="addTask()">Add Task</button>

        <ul id="taskList">
            </ul>
    </div>

    <script>
        // 🚨 CRITICAL: PASTE YOUR REAL RENDER URL HERE AGAIN!
        const RENDER_API_URL = "https://my-first-api-1evm.onrender.com";

        async function fetchTasks() {
            const response = await fetch(`${RENDER_API_URL}/tasks`);
            const tasks = await response.json();
            
            const list = document.getElementById("taskList");
            list.innerHTML = ""; 
            tasks.forEach(task => {
                let li = document.createElement("li");
                // We added a red Delete button next to the text!
                li.innerHTML = `
                    <span>ID ${task.id}: ${task.title}</span>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">X</button>
                `;
                list.appendChild(li);
            });
        }

        async function addTask() {
            const inputField = document.getElementById("taskInput");
            const newTaskTitle = inputField.value;

            if (newTaskTitle === "") {
                alert("Please type a task first!");
                return;
            }

            await fetch(`${RENDER_API_URL}/add-task`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title: newTaskTitle, is_completed: false })
            });

            inputField.value = "";
            fetchTasks(); 
        }

        // --- NEW: The Phone Call to DELETE a task ---
        async function deleteTask(taskId) {
            await fetch(`${RENDER_API_URL}/delete-task/${taskId}`, {
                method: "DELETE"
            });
            // Refresh the list immediately so the deleted item vanishes from the screen!
            fetchTasks(); 
        }

        fetchTasks();
    </script>

</body>
</html>
